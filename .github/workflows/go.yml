name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26', '1.27']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v2.15.0

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
