services:
  bot:
    build: .
    environment:
      UBOT_TELEGRAM_TOKEN: ${UBOT_TELEGRAM_TOKEN}
      UBOT_EMAIL_FROM: ${UBOT_EMAIL_FROM}
      UBOT_EMAIL_TO: ${UBOT_EMAIL_TO}
      UBOT_SMTP_HOST: ${UBOT_SMTP_HOST}
      UBOT_SMTP_PORT: ${UBOT_SMTP_PORT}
      UBOT_PASSWORD: ${UBOT_PASSWORD}
      PORT: ${PORT:-8080}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - "files-data:/files"
    restart: unless-stopped

volumes:
  files-data: {}
